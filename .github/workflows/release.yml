name: Release

on:
  pull_request:
  push:
    paths-ignore:
      - '**/README*.md'
      - 'docs/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            artifact: packages-arm64
          - arch: arm/v7
            artifact: packages-arm-v7

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build package
        run: scripts/package
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create --generate-notes "${{ github.ref_name }}" ./packages/*.deb
